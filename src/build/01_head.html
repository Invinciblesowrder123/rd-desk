<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家电研发推进中台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%236366f1'/%3E%3Cpath d='M7 16.5V9.5M12 16.5V6.5M17 16.5v-4' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f7fc;
  --bg-2:#eef1fa;
  --card:#ffffff;
  --ink:#17203a;
  --ink-2:#586180;
  --ink-3:#8b95ad;
  --line:#e8ecf6;
  --line-2:#dfe5f2;
  --brand:#6366f1;
  --brand-2:#8b5cf6;
  --brand-soft:#eef0fe;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
  --green:#059669;
  --green-soft:#e8f7f0;
  --red:#e11d48;
  --red-soft:#fdecf0;
  --amber:#d97706;
  --amber-soft:#fdf4e3;
  --blue:#0284c7;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(23,32,58,.04),0 8px 28px -12px rgba(23,32,58,.12);
  --shadow-lg:0 18px 48px -18px rgba(99,102,241,.42);
  --sb-w:224px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;min-height:100dvh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{display:block;flex:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:15px;height:15px}
.ico-lg{width:22px;height:22px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 外壳 ---------- */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{
  width:var(--sb-w);flex:none;position:fixed;inset:0 auto 0 0;z-index:40;
  background:linear-gradient(180deg,#ffffff 0%,#fbfcff 100%);
  border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand-mark{
  width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 8px 18px -8px rgba(99,102,241,.7);
}
.brand-mark .ico{stroke:#fff;width:19px;height:19px}
.brand-txt{line-height:1.25}
.brand-txt b{display:block;font-size:14.5px;letter-spacing:.2px}
.brand-txt span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.6px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav button{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
  color:var(--ink-2);font-size:14px;font-weight:500;transition:.16s;text-align:left;width:100%;
}
.side-nav button:hover{background:var(--bg-2);color:var(--ink)}
.side-nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side-nav button.on .ico{stroke:var(--brand)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.sync-pill{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;
  background:var(--bg);font-size:11.5px;color:var(--ink-2);line-height:1.4;
}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.14)}
.dot.busy{background:var(--amber);box-shadow:0 0 0 3px rgba(217,119,6,.16);animation:pulse 1.1s infinite}
.dot.off{background:var(--ink-3);box-shadow:0 0 0 3px rgba(139,149,173,.16)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.main{flex:1;min-width:0;margin-left:var(--sb-w);padding:22px 26px 40px}
.wrap{max-width:1180px;margin:0 auto}

/* 顶部横向导航（平板） */
.topnav{
  display:none;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:6px;margin-bottom:16px;box-shadow:var(--shadow);overflow-x:auto;
}
.topnav button{
  display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;
}
.topnav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.topnav .t-sync{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);padding:0 10px}

/* 底部 Tab（手机） */
.tabbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:50px;border-radius:11px;font-size:10.5px;color:var(--ink-3);font-weight:500;
}
.tabbar button.on{color:var(--brand)}
.tabbar button.on .ico{stroke:var(--brand)}

/* ---------- 页头 ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:21px;letter-spacing:-.3px;font-weight:700}
.page-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:6px}
.head-actions{display:flex;align-items:center;gap:9px}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 16px;border-radius:11px;font-size:13.5px;font-weight:600;
  background:#fff;border:1px solid var(--line-2);color:var(--ink-2);transition:.16s;
}
.btn:hover{border-color:#cdd5e8;color:var(--ink);background:#fdfdff}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad);border:none;color:#fff;box-shadow:0 10px 24px -12px rgba(99,102,241,.85)}
.btn-primary:hover{background:var(--grad);filter:brightness(1.04);color:#fff}
.btn-ghost{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3)}
.btn-sm{min-height:34px;padding:0 11px;font-size:12.5px;border-radius:9px;gap:5px}
.btn-danger{color:var(--red);border-color:#f6cdd8;background:#fff}
.btn-danger:hover{background:var(--red-soft);color:var(--red);border-color:#f2b8c7}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-icon{width:34px;height:34px;min-height:34px;padding:0;border-radius:9px}

/* ---------- 卡片与栅格 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;
}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:14.5px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card-h .muted{font-size:11.5px;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-3)}
.tiny{font-size:11.5px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* KPI 条 */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);
}
.kpi .k-label{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.kpi .k-val{font-size:21px;font-weight:700;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .k-val em{font-size:11.5px;font-style:normal;color:var(--ink-3);font-weight:600;margin-left:2px}
.kpi.warn .k-val{color:var(--red)}
.kpi.ok .k-val{color:var(--green)}

/* 今天要处理 */
.attn-wrap{margin-bottom:16px}
.attn-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.attn-head h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.attn-list{display:grid;gap:10px}
.attn{
  display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;
  border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);
}
.attn .a-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.attn .a-body{flex:1;min-width:0}
.attn .a-title{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.attn .a-desc{font-size:12px;color:var(--ink-2);margin-top:2px}
.attn .a-actions{display:flex;gap:7px;flex:none}
.attn.red{background:linear-gradient(180deg,#fff8fa,#fff);border-color:#f8d3dd}
.attn.red .a-ico{background:var(--red-soft);color:var(--red)}
.attn.red .a-title{color:#b3123c}
.attn.amber{background:linear-gradient(180deg,#fffcf4,#fff);border-color:#f6e3bd}
.attn.amber .a-ico{background:var(--amber-soft);color:var(--amber)}
.attn.amber .a-title{color:#a35c05}
.attn.blue{background:linear-gradient(180deg,#f7fbff,#fff);border-color:#d6e9f8}
.attn.blue .a-ico{background:#eaf5fd;color:var(--blue)}

/* 今日双栏 */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:16px;align-items:start}
.col-side{position:sticky;top:18px;display:grid;gap:14px}
.col-side .card + .card{margin-top:0}

/* 项目卡 */
.pcard{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:.18s;
}
.pcard:hover{box-shadow:0 2px 4px rgba(23,32,58,.05),0 14px 34px -16px rgba(23,32,58,.2);border-color:var(--line-2)}
.pcard + .pcard{margin-top:12px}
.pcard .bar{height:3px;width:100%}
.pcard .p-in{padding:14px 16px 15px}
.p-top{display:flex;align-items:flex-start;gap:10px}
.p-name{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.35}
.p-unit{font-size:11.5px;color:var(--ink-3);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.p-menu{display:flex;gap:4px;margin-left:auto;flex:none}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:6px;
  font-size:10.5px;font-weight:650;letter-spacing:.2px;background:var(--bg-2);color:var(--ink-2);
}
.chip.stage-概念{background:#f3e8ff;color:#7e22ce}
.chip.stage-设计{background:#e0f2fe;color:#0369a1}
.chip.stage-手板{background:#fef3c7;color:#a16207}
.chip.stage-试产{background:#ffe4e6;color:#be123c}
.chip.stage-量产{background:#dcfce7;color:#15803d}
.chip.buf{background:var(--amber-soft);color:#a35c05}
.chip.late{background:var(--red-soft);color:#be123c}
.chip.on-time{background:var(--green-soft);color:#047857}
.chip.back{background:#eef2ff;color:#4f46e5}

.p-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.metric{background:var(--bg);border-radius:10px;padding:8px 10px}
.metric .m-l{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .m-v{font-size:14px;font-weight:700;letter-spacing:-.2px;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric .m-v small{font-size:10.5px;color:var(--ink-3);font-weight:600}
.metric .m-v.green{color:var(--green)}
.metric .m-v.red{color:var(--red)}

.plan-line{
  margin-top:10px;display:flex;gap:8px;align-items:flex-start;
  background:linear-gradient(90deg,#faf9ff,#fff);border:1px solid #eeebfb;border-radius:10px;padding:8px 10px;
}
.plan-line .ico{stroke:var(--brand-2);margin-top:2px}
.plan-line .p-txt{font-size:11.5px;color:var(--ink-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan-line .p-txt b{color:var(--brand-2);font-weight:650}

.p-report{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.qty-box{display:flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:#fff}
.qty-box input{
  width:74px;height:40px;border:none;text-align:center;font-size:15px;font-weight:700;color:var(--ink);
  background:transparent;font-variant-numeric:tabular-nums;-moz-appearance:textfield;
}
.qty-box input::-webkit-outer-spin-button,.qty-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty-box .qb-lbl{font-size:11px;color:var(--ink-3);padding:0 9px;border-right:1px solid var(--line);height:40px;display:flex;align-items:center;background:var(--bg)}
.qty-box .qb-unit{font-size:11.5px;color:var(--ink-3);padding:0 9px;height:40px;display:flex;align-items:center;border-left:1px solid var(--line);background:var(--bg)}
.p-report .hint{font-size:11px;color:var(--ink-3)}
.p-report .spacer{flex:1}

.progress-thin{height:5px;border-radius:3px;background:var(--bg-2);overflow:hidden;margin-top:12px}
.progress-thin i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.22,1,.36,1)}

/* 新建入口 */
.new-entry{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  min-height:56px;margin-top:12px;border-radius:14px;border:1.5px dashed #d5d9ee;
  color:var(--brand);font-size:13.5px;font-weight:650;background:linear-gradient(180deg,#fbfbff,#fff);transition:.16s;
}
.new-entry:hover{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 8px 24px -16px rgba(99,102,241,.8)}

/* 侧栏小卡 */
.risk-item{padding:10px 0;border-bottom:1px dashed var(--line)}
.risk-item:last-child{border-bottom:none;padding-bottom:0}
.risk-item:first-child{padding-top:0}
.risk-name{font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.risk-name i{width:6px;height:6px;border-radius:2px;flex:none}
.risk-txt{font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.55}
.risk-txt em{font-style:normal;color:var(--brand-2);font-weight:650}
.ring-mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ring-mini:last-child{border-bottom:none}
.ring-mini .rm-name{font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring-mini .rm-val{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- 看板 ---------- */
.board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.bcard .bar{height:3px}
.bcard .b-in{padding:15px 16px}
.b-head{display:flex;align-items:flex-start;gap:12px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ring-pct{
  position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:750;
  letter-spacing:-.4px;font-variant-numeric:tabular-nums;
}
.b-title{flex:1;min-width:0}
.b-title h3{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.b-title .b-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.b-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.b-num{background:var(--bg);border-radius:10px;padding:9px 10px}
.b-num .n-l{font-size:10.5px;color:var(--ink-3)}
.b-num .n-v{font-size:14px;font-weight:750;margin-top:1px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.b-num .n-v small{font-size:10.5px;color:var(--ink-3);font-weight:600}
.b-num .n-v.green{color:var(--green)}
.b-num .n-v.red{color:var(--red)}
.b-num .n-v.amber{color:var(--amber)}
.b-plan{
  margin-top:11px;font-size:11.5px;color:var(--ink-2);line-height:1.6;
  background:linear-gradient(90deg,#faf9ff,#fff);border:1px solid #eeebfb;border-radius:10px;padding:9px 11px;
}
.b-plan b{color:var(--brand-2);font-weight:650}
.b-logs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.b-logs .lg-h{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;margin-bottom:6px}
.lg-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11.5px;border-bottom:1px dashed #f1f3fa}
.lg-row:last-child{border-bottom:none}
.lg-date{color:var(--ink-2);font-variant-numeric:tabular-nums;width:56px;flex:none}
.lg-qty{font-weight:700;color:var(--ink);width:60px;flex:none}
.lg-note{flex:1;min-width:0;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-del{width:26px;height:26px;min-height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.lg-del:hover{background:var(--red-soft);color:var(--red)}

/* 堆叠柱状图 */
.chart-card{grid-column:1/-1}
.chart-box{overflow-x:auto;padding-bottom:2px}
.chart-svg{width:100%;height:auto;display:block;min-width:520px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- 周报 ---------- */
.week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.week-nav .wk-label{font-size:13px;font-weight:700;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.wk-table{width:100%;border-collapse:collapse;font-size:12.5px}
.wk-table th{
  text-align:left;font-size:11px;font-weight:650;color:var(--ink-3);padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg);
}
.wk-table th:first-child{border-radius:9px 0 0 0}
.wk-table th:last-child{border-radius:0 9px 0 0}
.wk-table td{padding:11px 10px;border-bottom:1px solid #f2f4fb;vertical-align:middle}
.wk-table tr:last-child td{border-bottom:none}
.wk-table td.num{font-variant-numeric:tabular-nums;font-weight:650}
.wk-name{display:flex;align-items:center;gap:7px;font-weight:600}
.wk-name i{width:7px;height:7px;border-radius:2px;flex:none}
.delta{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap}
.delta.up{background:var(--green-soft);color:#047857}
.delta.down{background:var(--red-soft);color:#be123c}
.delta.flat{background:var(--bg-2);color:var(--ink-3)}

.kpt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpt{display:flex;flex-direction:column;gap:6px}
.kpt label{font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.kpt label i{width:5px;height:5px;border-radius:50%;flex:none}
.kpt textarea{
  width:100%;min-height:88px;padding:10px 12px;border:1px solid var(--line-2);border-radius:11px;
  font-size:13px;line-height:1.6;resize:vertical;background:#fff;transition:.15s;color:var(--ink);
}
.kpt textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.1);outline:none}
.report-preview{

/* ---------- 我的 ---------- */

.steps{counter-reset:s;display:grid;gap:10px}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;z-index:90;background:rgba(18,24,44,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.mask.on{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:480px;max-height:88vh;overflow:auto;background:#fff;border-radius:18px;
  box-shadow:0 30px 80px -20px rgba(15,23,42,.45);padding:20px;transform:translateY(10px) scale(.99);
  transition:transform .2s cubic-bezier(.22,1,.36,1);
}
.mask.on .modal{transform:none}
.modal h3{font-size:16px;font-weight:750;letter-spacing:-.3px;margin-bottom:4px}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;width:calc(100% - 32px);max-width:420px}
.toast{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:#17203a;color:#fff;
  font-size:12.5px;box-shadow:0 16px 40px -14px rgba(15,23,42,.6);animation:tin .22s ease;
}
.toast .t-msg{flex:1;line-height:1.45}
.toast .ico{stroke:#fff}
.toast.err{background:#8f1731}
.toast.ok{background:#065f46}
.toast button{color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:7px;background:rgba(255,255,255,.18)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 骨架 ---------- */
.skel{background:linear-gradient(90deg,#eef1f8 25%,#f6f8fd 37%,#eef1f8 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skel-card{height:118px;border-radius:14px;margin-bottom:12px}
.empty{
  text-align:center;padding:34px 18px;color:var(--ink-3);font-size:13px;
  border:1.5px dashed var(--line-2);border-radius:14px;background:#fcfdff;
}

/* ---------- 彩带 ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.confetti i{
  position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;opacity:0;
  animation:fall linear forwards;
}
@keyframes fall{
  0%{opacity:1;transform:translateY(0) rotate(0)}
  100%{opacity:0;transform:translateY(102vh) rotate(680deg)}
}
.pop-in{animation:pop .34s cubic-bezier(.22,1.4,.36,1)}
@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}

/* 离线提示 */
.offline-bar{

.node-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}

.ns-h{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-3);margin-bottom:7px;flex-wrap:wrap}

.gantt{width:100%;height:auto;display:block;overflow:visible}
.gantt-wrap{margin-top:12px;padding:8px 8px 4px;border-radius:11px;background:#fbfcff;border:1px solid var(--line)}

.nd-seq{width:20px;height:20px;border-radius:6px;background:var(--bg-2);color:var(--ink-2);font-size:10.5px;
  font-weight:750;display:grid;place-items:center;flex:none}

.nd-main{flex:1;min-width:0}
